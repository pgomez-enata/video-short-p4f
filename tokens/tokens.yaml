        y: 38
        porcentaje: 3.5
      barra_reproductor: 90
    _zona_origen: "Título al 5 % y acción al 3.5 % del lienzo, que es el criterio de EBU R95 y SMPTE para 16:9. La franja del reproductor es conservadora a propósito: la barra de YouTube a 1080p ocupa menos, pero el lower-third no debe quedar nunca por debajo de ella."
    overlay:

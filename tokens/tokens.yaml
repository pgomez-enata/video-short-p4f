    _fondo_nota: "Misma razón que barra_escena: placa opaca sobre vídeo en `ink`, no en `fondo`."
    alto_minimo_px: 152
    padding_y_px: 22
    _alto_origen: "`alto_minimo_px` es el SUELO, no el alto. El alto real lo calcula `nucleo.lower_third()` sumando las tres líneas que lleva dentro. Con 152 px fijos, la línea de detalle acababa 18 px POR DEBAJO del borde de la placa en los 3 lower-thirds del sistema: sobre vídeo eso significa que el cargo se leía contra el fotograma, no contra el ink. No lo veía ningún control porque `placa()` no registraba su caja en ninguna lista, así que no había contra qué comparar. Misma familia que la barra de escena de 104 px: un componente puede sangrar, su texto no."
  barra_escena:
    _que_es: "La barra superior del overlay: logo a la izquierda, etiqueta de momento a la derecha. Marca la escena sin robarle sitio a la cámara."
    alto_px: 132
    logo_alto_px: 53
    padding_x_px: 96
    fondo: "ink"
    filete_inferior_px: 4
    filete_color: "verde"
    etiqueta:
      rol: "etiqueta"
      tamano_px: 24
    eje_contenido_px: 80
    _alto_origen: "104 px dejaban el texto de la barra a y=52, por encima del límite de título (54). Con 132 y el contenido centrado en y=80 el logo ocupa 55..105 y la etiqueta 68..92: los dos dentro de la zona segura."
    _fondo_nota: "Sigue en `ink`, no en `fondo`, a propósito: esta barra va SOBRE imagen de cámara, y el ink (#121D30) es un punto más claro que el fondo de pieza (#000714), lo justo para que no abra un agujero negro en el fotograma. Contraste entre los dos: 1.20."
    _logo_alto_origen: "53 px es el alto con el que `p4f-lockup-blanco.svg` alcanza los 120 px de ancho que declara `logo.minimos.lockup_px`. Estaba en 50 (115 px de ancho) y era uno de los 14 logos por debajo del mínimo que encontró la auditoría del 16-ago-2026. NO se escribe a mano: sale de `nucleo.alto_minimo_logo()`."
  franja_escena:
    _que_es: "La franja inferior del overlay: claim a la izquierda, cuenta de la edición a la derecha. Va POR ENCIMA de la barra del reproductor."
    alto_px: 72
    padding_x_px: 96
    fondo: "ink"
    texto:
      rol: "etiqueta"
      tamano_px: 22
  subtitulo:
    _que_es: "El subtítulo QUEMADO de un frame de historia en video. No es un lower-third: el lower-third dice quién habla y sale una vez; el subtítulo lleva lo que se está diciendo y está en pantalla casi todo el video. Por eso se centra en el eje y por eso su contraste se mide contra el fotograma, no contra el lienzo."
    rol: "subtitular"
    tamano_px: 56
    _tamano_origen: "MEDIDO, no elegido: en los 936 px de caja caben 28 caracteres de alfabeto medio a 56 px, y las 4 frases de control del tono P4F entran en 2 líneas. A 62 px una de ellas ya pedía 3 líneas, y una tercera línea de subtítulo en 9:16 empuja el bloque dentro de la franja que tapa Instagram."
    lineas_max: 2
    caracteres_linea_max: 32
    _caracteres_origen: "28 medidos con alfabeto medio (a-z + A-Z). El límite duro se pone en 32 porque el ancho real depende de las letras: el control que manda es el ancho en píxeles, este número es la guía para quien escribe el guion."
    interlineado: 1.15
    paso_px: 64
    alto_bloque_px: 197
    padding_x_px: 30
    padding_y_px: 22
    radio_px: 10
    filete_px: 8
    filete_lado: "superior"
    _filete_origen: "El lower-third lleva el filete a la IZQUIERDA y se ancla al margen. El subtítulo se centra en el eje, así que un filete lateral le rompería la simetría cada vez que cambia el largo de la frase. Va arriba, del ancho de la caja: mismo golpe de color, un solo eje."
    fondo: "ink"
    color: "blanco"
    filete_color: "verde"
    color_resalte: "verde"
    velo_alfa: 0.8
    _velo_origen: "CALCULADO, no elegido a ojo. Sobre el peor fotograma posible (blanco puro) el blanco pasa AA con un velo al 0.62, pero el VERDE del resalte no llega a 4.5 hasta 0.8. Un solo alfa para las dos variantes con velo, y es el que sirve a la más exigente. El doctor lo recalcula."
    alineacion: "centrada"
    _alineacion_origen: "El sistema compone a la izquierda en todas sus piezas. El subtítulo es la excepción y tiene motivo: es lo único de la pieza que cambia de ancho cada 2 segundos, y anclado a la izquierda hace que el bloque baile de largo en cada corte. Centrado, lo que crece lo hace hacia los dos lados y el eje no se mueve."
    variantes:
      _regla: "Tres formas, un mismo bloque y una misma ubicación: lo único que cambia es el fondo bajo el texto. Cuál entra al sistema lo cierra Piero."
      placa:
        _que_es: "Caja ink OPACA con filete verde arriba. El contraste no depende del fotograma."
        fondo: "ink"
        opacidad: 1.0
        color: "blanco"
        contraste_declarado: 16.88
        _cuando: "material rodado sin control de fondo: exteriores, público, luz que cambia dentro del mismo plano."
        _coste: "es la que más fotograma tapa."
      velo:
        _que_es: "Velo ink translúcido y texto blanco. Deja ver el fotograma debajo."
        fondo: "ink"
        opacidad: 0.8
        color: "blanco"
        contraste_peor_caso: 8.94
        _cuando: "talking-head con fondo estable, donde tapar el plano entero es una pérdida."
        _coste: "el contraste ya no es un número fijo: depende del fotograma, y por eso existe el modo `sobre-foto`."
      resalte:
        _que_es: "Como `velo`, con la palabra que se está diciendo en verde. El estilo de reel."
        fondo: "ink"
        opacidad: 0.8
        color: "blanco"
        color_resalte: "verde"
        contraste_peor_caso: 4.6
        _cuando: "piezas de captación, donde el subtítulo ES el gancho y no solo accesibilidad."
        _coste: "el verde es lo que fija el alfa del velo. Con el 0.62 que le bastaría al blanco, el resalte se cae a 2.46 y no se lee. Y con 0.78, un solo escalón por debajo del declarado, se queda en 4.25: el doctor comprueba las dos direcciones."
    bandas:
      _que_es: "Las tres ALTURAS canónicas del subtítulo, dadas por la BASE del bloque. No son tres gustos: son las tres cosas distintas que puede haber ocupando el resto del frame."
      _origen: "La zona útil de una historia va de y=269 a y=1670: fuera de ahí lo tapa la propia app. Las tres bases se eligen dentro de esa franja y el doctor comprueba que el bloque entero cabe."
      baja:
        base_y: 1556
        _cuando: "POR DEFECTO. Nada más compite por la parte de abajo del frame."
        _holgura_px: 114
        _origen: "MARCADA POR PIERO en su boceto del 19-sep-2026, donde la tinta del subtítulo va de y=1447 a y=1508 (centro 1477.5). Con base 1556 el desvío del centro de tinta es de 16 px con una línea y 16 px con dos: es el punto que reparte el error entre los dos casos. Optimizando para una sola línea sería 1540 (0 y 32) y para dos, 1572 (32 y 0)."
      media:
        base_y: 1380
        _cuando: "cuando el frame lleva sticker nativo de Instagram (enlace, encuesta, pregunta). El sticker vive abajo y se pega encima del subtítulo si no se le deja sitio."
        _holgura_px: 290
      alta:
        base_y: 506
        _cuando: "cuando la mitad inferior del encuadre es la acción: el rostro en plano cerrado, las manos, el producto."
        _holgura_px: 40
        _base_origen: "la banda se coloca RESPECTO A la zona segura, no en un y absoluto: deja 40 px de aire bajo la interfaz de la app. Era 487 cuando el tope eran 250; al unificar el tope en 269 (19-sep-2026) baja a 506 para conservar los mismos 40. Lo cazó el doctor, que comprueba que la holgura declarada es la que se mide."
    alto_linea_px: 89
    _alto_linea_origen: "ascent + descent de Saira Bold a 56 px, leídos de la FUENTE con `getmetrics()`. La primera versión de este token puso 75, que es el bbox de «ÁQgjy»: la tinta de un texto concreto, no la caja de la fuente. Con ese número el bloque salía 14 px más corto de lo que se dibuja y las bandas quedaban mal calculadas. El doctor lo recalcula abriendo el .ttf."
    alto_bloque_1_linea_px: 133
    ancho_caja_max_px: 936
    ancho_texto_max_px: 876
    _ancho_origen: "`ancho_caja_max_px` es lo que puede medir LA CAJA: el ancho de la pieza menos los dos márgenes. El texto se envuelve contra `ancho_texto_max_px`, que descuenta el padding. Envolver contra el ancho de la caja fue el primer fallo de este componente: el bloque se salía 13–26 px por cada lado en 4 de los 6 frames, y el overflow sí lo vio."
  _nota_proporciones: "Los 9 componentes de la tanda C declaran sus medidas como PROPORCIÓN de su caja, no en pt ni en px. Es lo que permite que el mismo componente sirva en una hoja de 612 pt y en un lienzo de 1080 px sin duplicar valores — y duplicarlos es cómo se desincronizan."
  metrica:
    _que_es: "Placa de dato: icono, cifra grande, etiqueta y nota. Es el bloque de «+1,400 IAVANZA» de la p.11 y el de «2 EDICIONES» de la p.3."
    _origen: "pp. 3 y 11 de la revista de referencia."

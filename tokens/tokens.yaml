  streaming:
    _nota: "1920×1080 siempre. Un overlay va SOBRE video: su lienzo es RGBA y todo lo que no es placa queda transparente, para poder cargarlo tal cual en OBS o StreamYard."
    px:
      - 1920
      - 1080
    margen_px:
      _nota: "En broadcast el margen de composición ES la zona segura de título: no tiene sentido un margen propio más generoso que lo que el televisor no recorta. Abajo manda la barra del reproductor (90), que es mayor que los 54 de título."
      izquierda: 96
      derecha: 96
      arriba: 54
      abajo: 90
    zona_segura_px:
      _nota: "NO es el margen. `titulo` es lo que un televisor puede recortar y donde por tanto no va texto; `accion` es el límite de cualquier gráfico; `barra_reproductor` es la franja de abajo que el reproductor tapa con sus controles cuando el espectador mueve el ratón."

# GENERADO por build.py desde tokens/tokens.json — NO EDITAR A MANO
meta:
  marca: "Pitch 4 Fun"
  version: "1.0.0"
  actualizado: "2026-08-15"
  descripcion: "FUENTE DE VERDAD del sistema de diseño Pitch 4 Fun. Todo lo demás (CSS, YAML, Python, plantillas) se GENERA desde aquí con `python3 build.py`. No edites los generados: edita este y vuelve a correr el build."
  organizadores: "Fundación Enlata + IAvanza (HUB de Innovación)"
  cadencia: "2 ediciones al año. El sistema se construye para CUALQUIER edición: lo que cambia va en `edicion`, no horneado en las plantillas."
  fuentes_de_verdad:
    - "_fuente/hoja-de-marca-disenador.pdf — vector oficial de la marca (22-mar-2026). Declara y contiene los 3 colores y la tipografía Obvia. Rescatado de `02_P4F_Marketing-20260709T215816Z-2-001.zip` → `web/pitch 4 fun/logo pitch for fun .pdf`. Original en (fuera del repo) Pitch4Fun/"
    - "logo/ — 10 SVG extraídos de ese PDF y verificados a 0.00–0.26 % de diferencia fuera de bordes contra el original"
  privado:
    _nota: "Lo que NO sale del taller a un repo público, con su motivo al lado. Añadir un puntero aquí es lo único que hace falta para que un dato nuevo deje de salir. Lo aplica `empaquetar.py` y lo comprueba `prepublicar.py`."
    punteros:
      - "meta.fuentes_de_verdad — lleva la ruta del disco de Piero (`(fuera del repo)`). En el paquete se sanea a «(fuera del repo)»."
      - "_derivados/ y _salida/ — carpetas de trabajo. Se regeneran corriendo el sistema."
      - "_fuente/referencia-revista/ — los dos collages del evento con 73 caras de personas reales, y los 12 recortes que salen de ellos. NO viajan, y la maqueta se publica regenerada con `prototipo.py sin-fotos` porque las fotos van HORNEADAS dentro de sus PNG."
      - "PLAN.html — el cuaderno de trabajo del sistema, con rutas y notas internas."
      - "meta.privado.rnc_organizador — identidad fiscal. Estaba escrito literal dentro de `auditoria.py` y lo paró la puerta el 17-ago-2026. Al vaciarlo, la regla `rnc-correcto` del frente 3 NO calla: emite un hallazgo diciendo que no se pudo comprobar. Quien clone el repo pone el suyo aquí y la regla vuelve sola."
      - "_salida/historias/sobre-foto/ — las composiciones de los overlays sobre fotogramas REALES del evento. Llevan las caras de los dos collages, igual que `_fuente/referencia-revista/`. No viajan: `empaquetar.py` copia `_salida/historias/*.png` y estas son .jpg, así que quedan fuera por construcción — y queda escrito aquí para que no sea por accidente. La garantía de contraste la dan los 4 fotogramas SINTÉTICOS, que no llevan a nadie dentro."
      - "logo/organizadores/ — los wordmarks de Fundación Enlata e IAvanza, copiados de sus propios sistemas de marca (`04 Marca/logo_enlata/` e `iavanza_design_system/`). NO viajan al repo público de P4F: son marcas con su licencia y su sistema aparte, y este repo no las redistribuye. Quien clone y quiera el end card pone los suyos aquí. Sin ellos, `fila_logos` deja el hueco marcado, que es lo que ya hace con «Ayudar me da vida»."
      - "audio/ — las dos pistas de fondo y sus camas. No consta su licencia, así que no viajan al repo público. Sus MEDIDAS sí van, en `tokens.audio`: un número no es la obra."
      - "logo/marco/ — el lockup de la GEW RD, el evento dentro del que ocurre Pitch 4 Fun. Viene del sistema GEW, que también es nuestro, pero no viaja al paquete público por la misma razón que `logo/organizadores/`: cada marca reparte sus propios activos."
    rnc_organizador: ""
    personas_a_proteger: []
    _personas_motivo: "VACÍA Y DECLARADA, no vacía por accidente: son cosas distintas y `prepublicar.py` las distingue (en el sistema hermano una lista vacía por accidente apagó la regla y publicó 5 nombres reales con el escáner en verde). En P4F no hay ninguna persona real en los tokens: `organizadores` son dos organizaciones, `proyectos.edicion_1` son marcas de proyecto que se presentaron en un evento público, y las 6 personas del prototipo están inventadas y marcadas con asterisco en la propia página. Si algún día entra una persona real —un jurado, un mentor, un testimonio—, su nombre va aquí ANTES de que entre en ninguna pieza."
    nombres_permitidos:
      - "Piero"
      - "Piero Gómez"
    _nombres_permitidos_motivo: "El autor del sistema. Aparece porque es quien decide y quien publica, y las decisiones cerradas se le atribuyen por nombre: quitarlo dejaría el histórico sin autor. Declarado aquí para que no parezca una excepción escondida."
  decisiones_cerradas:
    - "PALETA — cerrado por Piero el 15-ago-2026: manda la hoja del diseñador (#0595F0 · #83CE00 · #121D30), que es lo que está DENTRO del logo. La `Pitch4Fun_LineaGrafica_v1/v2.pdf` (27-feb-2026) declaraba #C5F97E y #111827; esos valores quedan RETIRADOS. Ver `color.retirados`."
    - "TIPOGRAFÍA — cerrado por Piero el 15-ago-2026: Obvia es comercial y no está instalada. El logo se congela en curvas (ya no la necesita) y las piezas usan una sustituta libre elegida MIDIENDO. Ganó Saira (SIL OFL) con distancia 0.567 sobre 7 métricas; Poppins (1.337) y Archivo (1.367) quedaron lejos por anchas."
    - "ARQUITECTURA — cerrado por Piero el 15-ago-2026: sistema PROPIO con la receta de iavanza_design_system, no submarca dentro de él. P4F tiene marca propia."
    - "HOJA — cerrado por Piero el 15-ago-2026: 8.5 × 11 pulgadas (612 × 792 pt). NO A4."
    - "ALCANCE — cerrado por Piero el 15-ago-2026: editorial (revista + hojas internas), redes, streaming y patrocinadores. NO entra la plantilla de deck 10×30s de pitchers."
    - "LA WEB NO ES FUENTE — cerrado por Piero el 15-ago-2026: el sitio está desactualizado y se reconstruye ENTERO después de terminar el sistema. Su `styles.css` y su `logo.svg` (una reconstrucción con Impact y paths inventados) no entran en el sistema."
    - "FORMATO DEL PITCH — cerrado por Piero el 15-ago-2026: 8 proyectos de 3 minutos. La primera edición fueron 5 minutos. Ni «3+3» ni «10×30 s»: las dos guías anteriores estaban mal."
    - "NOMBRES DE PROYECTO — cerrado por Piero el 15-ago-2026: Muuving · Vixual · Eco Ernesto Visita · MelizAI. Ver `proyectos`."
    - "CIFRAS — confirmadas por Piero el 15-ago-2026: las de la revista de referencia son buenas y se pueden imprimir. Ver `metricas`, que guarda de dónde vienen."
    - "CO-MARCA — cerrado por Piero el 15-ago-2026: los tres logos no van siempre juntos; a los ejecutores se los nombra como Fundación Enlata e IAvanza. Ver `organizadores.regla`."
    - "TIPOGRAFÍA INSTALADA — Piero pidió instalar Saira el 15-ago-2026: las 12 caras están en ~/Library/Fonts y el sistema las registra. Desbloquea la salida vectorial."
    - "FONDO — cerrado por Piero el 16-ago-2026: manda #000714, el de las 8 páginas de la revista de referencia. #0A1628 (lo que declaraba el sistema) y #121D2F (el de los 7 assets sueltos) quedan RETIRADOS como fondos. Es el mejor de los tres en contraste (blanco 20.18 · verde 10.37 · azul 6.31)."
    - "SUPERFICIE CLARA — cerrado por Piero el 16-ago-2026: #E6F7FE entra como superficie DECORATIVA, no como tema de color. Ahí el texto va siempre en ink; azul y verde solo pueden ser forma, porque como tinta dan 2.91 y 1.77."
    - "AZUL PROFUNDO — cerrado por Piero el 16-ago-2026: #063780 entra como superficie secundaria y fondo de rayo. Estaba en las 8 páginas y en 5 de los 7 assets sin estar declarado en ningún sitio."
    - "COLORES DE APOYO — cerrado por Piero el 16-ago-2026: los tres de la guía v2 (#256A8C, #44B4B8, #F97316) se RETIRAN en firme. Llevaban desde el paso 1 sin rol; el naranja no tiene un solo píxel en las 15 referencias. La paleta queda en 4 colores con función y 3 superficies, cero decorativos."
    - "EXPANSIÓN — cerrado por Piero el 16-ago-2026: el sistema crece en 4 tandas — superficies y color · iconografía · componentes de contenido · gráficos y normalización de la cabecera de sección."
  decisiones_pendientes:
    - "ITÁLICA: el sistema usa la itálica REAL de Saira (dibujada, ángulo −12° correcto) aunque la romana inclinada por software quede métricamente más cerca del logo (0.567 vs 1.745). Decisión mía, no de Piero. Se revierte cambiando `tipografia.italica.modo` a `oblicua`."
    - "OFF-WHITE: el diseñador no declaró ninguno. El sistema usa blanco puro (que sí está en el logo) y deriva sus grises del ink. Si Piero quiere un hueso de fondo, `neutros.hueso` ya está calculado."
color:
  _nota: "Los 3 primitivos salen medidos del content stream del vector, no de una guía escrita ni de un PNG. Los neutros se derivan del ink en HSV para que toda la escala comparte el mismo matiz (h=218°)."
  primitivos:
    azul:
      hex: "#0595F0"
      origen: "hoja del diseñador, declarado en texto y medido en el vector (`0.02 0.584 0.941 rg`) y en los píxeles opacos de los PNG. Los tres coinciden."
      rol: "EL COLOR DE LA MARCA. El micrófono y el cuerpo del «4»."
    verde:
      hex: "#83CE00"
      origen: "hoja del diseñador, declarado y medido. Vive en los stops del degradado del rayo."
      rol: "ACENTO Y ENERGÍA. El rayo, el tagline, los CTA. Nunca es color de fondo de una pieza entera."
    ink:
      hex: "#121D30"
      origen: "hoja del diseñador, declarado y medido en el vector (`0.071 0.114 0.188 rg`), que es el fondo de su banda oscura."
      rol: "FONDO PRINCIPAL y color de texto sobre claro."
    blanco:
      hex: "#FFFFFF"
      origen: "el wordmark del lockup sobre fondo oscuro"
      rol: "texto sobre ink, y fondo de las piezas claras"
  neutros:
    _nota: "Derivados del ink en HSV (h=218°, s=0.625) bajando saturación al subir luminosidad. Cada hex lleva su contraste medido sobre blanco."
    ink-2:
      hex: "#182438"
      contraste_sobre_blanco: 15.58
      rol: "superficie elevada sobre ink"
    ink-3:
      hex: "#2B3B57"
      contraste_sobre_blanco: 11.25
      rol: "tarjetas y bloques sobre ink"
    gris-texto:
      hex: "#5A6985"
      contraste_sobre_blanco: 5.53
      rol: "texto secundario sobre claro — pasa AA"
    gris-borde:
      hex: "#ACB6C7"
      contraste_sobre_blanco: 2.04
      rol: "bordes y separadores. NUNCA texto sobre claro"
    gris-velo:
      hex: "#E1E6F0"
      contraste_sobre_blanco: 1.25
      rol: "superficie de reposo, fondos de tabla"
    hueso:
      hex: "#EFF3F9"
      contraste_sobre_blanco: 1.11
      rol: "fondo de página alternativo. Sin uso hasta que Piero lo pida"
  superficies:
    _nota: "Un color de SUPERFICIE no es un color de tinta. Salen medidos de las 15 referencias que entregó Piero el 15-ago-2026 (8 páginas de revista + 7 assets), no de una guía escrita. Cada superficie clasifica LOS 10 COLORES del sistema en tres listas exhaustivas, y `build.py doctor` las recalcula una por una: declarar una tinta permitida que no llega a 4.5 es un fallo, y declarar prohibida una que sí se lee, también."
    _umbral_listas: "tinta_permitida ≥ 4.5 · tinta_solo_grande 3.0–4.5 · tinta_prohibida < 3.0. Las superficies no se clasifican entre ellas: una superficie no es una tinta."
    fondo:
      hex: "#000714"
      origen: "color dominante de las 8 páginas de la revista de referencia. Medido sobre la miniatura de cada página: aparece en las 8."
      rol: "EL FONDO de toda pieza oscura del sistema. Sustituye a #0A1628 por decisión de Piero (16-ago-2026)."
      tinta_permitida:
        - "blanco"
        - "verde"
        - "azul"
        - "gris-borde"
        - "gris-velo"
        - "hueso"
      tinta_solo_grande:
        - "gris-texto"
      tinta_prohibida:
        - "ink"
        - "ink-2"
        - "ink-3"
    azul-profundo:
      hex: "#063780"
      origen: "familia de tono 210–225° presente en las 8 páginas y en 5 de los 7 assets, siempre como el rayo o el degradado del fondo. Media de los píxeles de esa familia en la página 1."
      rol: "superficie secundaria y fondo de rayo. NO es un tercer color de marca: es la sombra del azul."
      tinta_permitida:
        - "blanco"
        - "verde"
        - "gris-borde"
        - "gris-velo"
        - "hueso"
      tinta_solo_grande:
        - "azul"
      tinta_prohibida:
        - "ink"
        - "ink-2"
        - "ink-3"
        - "gris-texto"
      _aviso: "ink-3 sobre azul-profundo da 1.00 — son el MISMO valor de luminancia. Una tarjeta ink-3 sobre esta superficie es invisible sin filete."
    claro-rayo:
      hex: "#E6F7FE"
      origen: "color dominante de P4F_05_fondo_claro_rayo.jpg (16 % de los píxeles)."
      rol: "superficie clara decorativa. Decisión de Piero (16-ago-2026): entra al sistema SOLO como fondo, no como tema de color."
      tinta_permitida:
        - "ink"
        - "ink-2"
        - "ink-3"
        - "gris-texto"
      tinta_solo_grande: []
      tinta_prohibida:
        - "azul"
        - "verde"
        - "blanco"
        - "gris-borde"
        - "gris-velo"
        - "hueso"
      _aviso: "REGLA DURA: aquí el azul da 2.91 y el verde 1.77. Ninguno de los dos llega ni al umbral de texto grande, así que `tinta_solo_grande` está VACÍA a propósito. Sobre esta superficie los colores de marca son FORMA —rayos, filetes, pastillas con texto ink encima— y nunca tinta de texto."
  roles:
    _jerarquia: "El protagonista es el AZUL. El verde es acento: aparece poco y siempre sobre oscuro. Si una pieza se resuelve con fondo + azul + blanco, se resuelve así."
    fondo-principal: "fondo"
    fondo-claro: "blanco"
    superficie-oscura-2: "azul-profundo"
    superficie-clara-2: "claro-rayo"
    primario: "azul"
    acento: "verde"
    texto-sobre-oscuro: "blanco"
    texto-sobre-claro: "ink"
    texto-secundario-claro: "gris-texto"
    borde: "gris-borde"
  contraste:
    _nota: "Medido con la fórmula WCAG 2.1 sobre los hex reales. Estas son las REGLAS DURAS del sistema y las comprueba auditoria.py."
    _umbrales:
      AA_normal: 4.5
      AA_grande: 3.0
      AAA: 7.0
    medido:
      blanco_sobre_ink:
        ratio: 16.88
        AA_normal: true
        uso: "libre"
      ink_sobre_blanco:
        ratio: 16.88
        AA_normal: true
        uso: "libre"
      verde_sobre_ink:
        ratio: 8.68
        AA_normal: true
        uso: "libre — es la combinación del acento"
      ink_sobre_verde:
        ratio: 8.68
        AA_normal: true
        uso: "libre — texto en botón verde"
      ink_sobre_azul:
        ratio: 5.28
        AA_normal: true
        uso: "libre — ES la forma correcta de poner texto sobre azul"
      azul_sobre_ink:
        ratio: 5.28
        AA_normal: true
        uso: "libre"
      blanco_sobre_azul:
        ratio: 3.2
        AA_normal: false
        uso: "SOLO texto grande (≥24pt o ≥19pt bold). Nunca texto de cuerpo."
      azul_sobre_blanco:
        ratio: 3.2
        AA_normal: false
        uso: "SOLO texto grande. Para cuerpo en azul, usar fondo ink."
      verde_sobre_blanco:
        ratio: 1.95
        AA_normal: false
        uso: "PROHIBIDO como texto. El verde no se lee sobre claro."
      blanco_sobre_verde:
        ratio: 1.95
        AA_normal: false
        uso: "PROHIBIDO. Texto sobre verde va en ink."
      verde_sobre_azul:
        ratio: 1.64
        AA_normal: false
        uso: "PROHIBIDO. Los dos colores de marca no se tocan como texto/fondo."
      blanco_sobre_fondo:
        ratio: 20.18
        AA_normal: true
        uso: "libre — es la combinación por defecto del sistema"
      verde_sobre_fondo:
        ratio: 10.37
        AA_normal: true
        uso: "libre — el acento sobre el fondo nuevo gana 1.69 respecto a ink"
      azul_sobre_fondo:
        ratio: 6.31
        AA_normal: true
        uso: "libre"
      gris-texto_sobre_fondo:
        ratio: 3.65
        AA_normal: false
        uso: "SOLO texto grande. Para texto secundario sobre fondo, gris-borde (9.87)."
      blanco_sobre_azul-profundo:
        ratio: 11.25
        AA_normal: true
        uso: "libre"
      verde_sobre_azul-profundo:
        ratio: 5.78
        AA_normal: true
        uso: "libre — el acento sí funciona sobre la superficie secundaria"
      azul_sobre_azul-profundo:
        ratio: 3.52
        AA_normal: false
        uso: "SOLO texto grande. El azul sobre su propia sombra apenas se separa."
      ink_sobre_claro-rayo:
        ratio: 15.35
        AA_normal: true
        uso: "libre — es la ÚNICA tinta principal de la superficie clara"
      gris-texto_sobre_claro-rayo:
        ratio: 5.03
        AA_normal: true
        uso: "libre — texto secundario sobre superficie clara"
      azul_sobre_claro-rayo:
        ratio: 2.91
        AA_normal: false
        uso: "PROHIBIDO, ni siquiera en texto grande (no llega a 3.0). Solo forma."
      verde_sobre_claro-rayo:
        ratio: 1.77
        AA_normal: false
        uso: "PROHIBIDO. Solo forma."
    reglas_duras:
      - "Texto de cuerpo sobre azul → SIEMPRE ink, nunca blanco (3.20 no pasa AA)."
      - "El verde NUNCA es texto sobre fondo claro (1.95 sobre blanco, 1.77 sobre claro-rayo). Solo sobre superficie oscura."
      - "Verde y azul no se combinan como texto sobre fondo (1.64). En el logo conviven como formas, que es otra cosa."
      - "Sobre foto o vídeo: velo ink al 60–80 % antes de poner texto o logo."
      - "Sobre `claro-rayo` los dos colores de marca son FORMA, nunca tinta: azul 2.91 y verde 1.77 no llegan ni al umbral de texto grande. El texto ahí va en ink (15.35) o gris-texto (5.03)."
      - "Una tarjeta `ink-3` sobre `azul-profundo` es invisible: mismo valor de luminancia (1.00). Sobre esa superficie las tarjetas se separan con filete, no con relleno."
  retirados:
    _nota: "NO se usan. Están aquí para que auditoria.py los detecte en una pieza y diga de dónde salieron. Lo ya publicado con ellos no se retoca."
    #C5F97E: "«Neon Lime» de Pitch4Fun_LineaGrafica_v1/v2.pdf (27-feb-2026). No es el verde del logo, que es #83CE00. Tener los dos en circulación era el defecto principal de la marca."
    #111827: "«Dark Core» de la misma guía. El dark real del diseñador es #121D30."
    #009DFF: "azul del `logo.svg` que sirve el sitio web. Ese SVG no es el logo: es una reconstrucción a mano con Impact."
    #9DFF00: "verde del mismo SVG falso."
    #256A8C: "«Deep Teal» de la guía v2. RETIRADO EN FIRME por Piero el 16-ago-2026: llevaba desde el paso 1 sin rol y no aparece en ninguna de las 15 referencias. Su hueco funcional lo ocupa `azul-profundo`."
    #44B4B8: "«Cyan Teal» de la guía v2. Retirado en firme el 16-ago-2026, mismo motivo."
    #F97316: "«Orange Alt» de la guía v2. Retirado en firme el 16-ago-2026: además de no tener rol, no aparece en ninguna de las 15 referencias — es el único color de la guía que no tiene ni un píxel en el material real."
    #1CA0E6: "estimación a ojo de una memoria vieja mía. Nunca fue un color de la marca."
    #6FC42E: "misma estimación errónea."
    #0A1628: "fondo que el sistema declaró en el paso 1, derivado del ink. SUPERADO el 16-ago-2026 por #000714, que es el que usan las 8 páginas reales. No es un error: es un fondo anterior. Las piezas construidas antes de esa fecha lo llevan."
    #121D2F: "fondo de los 7 assets sueltos de la revista. SUPERADO por #000714. Es indistinguible del ink de marca (#121D30, contraste 1.00 entre ambos), lo que lo hacía especialmente malo como fondo: superficie y tinta oscura eran el mismo color."

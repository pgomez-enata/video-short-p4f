      valor: 400
      fichero: "Saira-Regular.ttf"
      italica: "Saira-RegularItalic.ttf"
    medium:
      valor: 500
      fichero: "Saira-Medium.ttf"
      italica: "Saira-MediumItalic.ttf"
    semibold:

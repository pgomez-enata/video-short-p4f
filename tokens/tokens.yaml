audio:
  _que_es: "Las dos pistas que Piero entregó el 19-sep-2026 para el fondo de los vídeos, y sus versiones de CAMA."
  _medido: "Todo con ffmpeg/loudnorm en ESTÉREO, que es como se entrega. Medir en mono y entregar estéreo deja la ganancia corta: R128 suma canales."
  objetivo_cama:
    lufs: -30.0
    true_peak_dbtp: -1.5
    lra: 11.0
    _origen: "−30 LUFS es cama bajo voz: unos 14 LU por debajo de los −16 a los que se mezcla una voz para redes, que es el margen en el que la música acompaña sin tapar. El true peak a −1.5 dBTP deja sitio al codificador: Instagram recodifica a AAC y un pico a 0 se convierte en distorsión audible."
    _nota_tp: "−1.5 dBTP es lo que se le PIDE al filtro. Lo que vale es lo medido después, que está en cada pista: el limitador de `loudnorm` no siempre llega al objetivo cuando la ganancia es grande. La regla dura, y la que comprueba el doctor, es que ninguna versión de trabajo pase de 0 dBTP."
  ⚠️_hallazgo: "LAS DOS ORIGINALES CLIPEAN. +1.11 dBTP la primera y +0.67 la segunda, por encima de 0. Y a −12.4 LUFS están unos 18 LU por encima de una cama: puestas tal cual debajo de una voz, la tapan. Las versiones `-cama` arreglan las dos cosas."
  _normalizado_como: "loudnorm en DOS PASADAS. Con una sola, el integrado se queda corto porque el filtro trabaja a ciegas; con la segunda, alimentada por las medidas de la primera, el desvío bajó a 0.21 y 0.02 LU."
  pistas:
    Measured_Intent:
      original:
        fichero: "audio/Measured_Intent.mp3"
        segundos: 179.49
        lufs: -12.44
        true_peak_dbtp: 1.11
        lra: 12.8
      cama:
        fichero: "audio/Measured_Intent-cama.m4a"

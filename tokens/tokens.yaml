        lra: 9.5
  _licencia: "Pistas de terceros que entregó Piero. NO viajan al repo público: no consta su licencia. Lo comprueba `meta.privado.punteros`."
  objetivo_solo:
    lufs: -16.0
    true_peak_dbtp: -1.5
    lra: 11.0
    _origen: "nivel de ENTREGA para redes, no de cama. Instagram normaliza alrededor de −14 LUFS y −16 deja margen. Es el que va cuando la música es lo único que suena."
    _por_que_dos: "MEDIDO en el montaje de prueba: con la cama de −30 y sin voz encima, el vídeo entero salió a −40.08 LUFS. Eso no es un error de la cama: −30 es el sitio de la música DEBAJO de alguien hablando. Sin voz hay que usar `-solo`. Dos niveles porque son dos casos, no porque uno esté mal."
    _nota_tp: "igual que la cama: `Measured_Intent-solo` quedó en −0.96 dBTP, no en los −1.5 pedidos, porque subir 12 LU deja poco sitio al limitador. Sigue por debajo de 0, que es lo que evita el crujido al recodificar, y el número declarado es el real."
  _regla_dura: "NINGUNA versión de trabajo (`-cama`, `-solo`) puede llegar a 0 dBTP. Las originales sí lo pasan, y por eso no se usan tal cual."
video:
  _que_es: "El proceso de EDICIÓN: de un clip crudo a la pieza publicable. Las cartelas —`titulo` y `endcard`— las dibuja `historias.py`; esto es lo que pasa con el vídeo que va entre las dos."
  _origen: "el paso a paso viene de las invitaciones a la Dominicana Tech Week de julio de 2026 (`01 Video/edicion de videos/`), que es donde se probó. Aquí no se copia: se traduce a tokens. Lo que allí eran constantes dentro de un script —el grade, el nivel de la cama, la posición del subtítulo— aquí son números con procedencia que el doctor comprueba."
  _lo_que_NO_se_hereda: "de aquella corrida NO viene el subtítulo quemado con libass ni sus números propios (fs56, MarginV 360, contorno 4). P4F ya sabe dibujar un subtítulo —`componentes.subtitulo`, con su placa, su contraste medido y su zona segura— y tener dos verdades sobre el mismo subtítulo es exactamente lo que este sistema existe para evitar. Se dibuja con el componente y se superpone como PNG."
  maestro:
    lufs: -13.0
    true_peak_dbtp: -1.5
    lra: 11
    canales: 2
    muestreo_hz: 48000
    margen_final_db: 0.3
    _margen_final_origen: "lo que el limitador del ajuste final (`_afinar_loudness`) deja por debajo del techo, para el codificador AAC. Medido en el montaje de IAvanza del 24-sep-2026, que pedía +0.54 dB: con 0 el pico salió a −1.51 dBTP (el techo es −1.5), con 0.3 a −1.80 y con 0.5 a −1.88, siempre a −13.03 LUFS y 48 kHz."
  _maestro_origen: "−13 LUFS desde el 23-sep-2026. Piero pidió subir el volumen (21-sep) y primero se puso −12, medido sobre UN clip (WhatsApp). Con el segundo clip real (IAvanza, picos 37 dB por encima de la voz) −12 no cabe: la cadena de voz solo llega a −14.09, `loudnorm` tendría que sumar +2.09 dB, el pico subiría a −0.75 dBTP y se pasa a modo dinámico — el maestro salió a −1.46 dBTP, por encima del techo, y nada lo decía. Medido en los dos clips: −13 es lo más alto que queda LINEAL en ambos (IAvanza con 0.25 dB de holgura de pico, WhatsApp con 1.28); −12.5 ya se pasa en IAvanza. Antes eran −14, que es lo que normalizan las plataformas; por eso este cambio se nota al descargar el fichero o al mandarlo por WhatsApp, y en Instagram o TikTok la normalización lo devuelve a su sitio. ⚠️ El reel B de la corrida DTW salió a −0.3 dBTP: pasaba la regla de entonces («true peak < 0») y estaba a tres décimas de recortar. Por eso aquí el objetivo es un número, no una desigualdad, y se mide en CADA salida."
  tolerancia_lufs: 0.5
  _tolerancia_origen: "`loudnorm` en dos pasadas cae dentro de ±0.5 LU del objetivo. Más estrecho que eso haría fallar mediciones correctas."
  transcripcion:
    _que_es: "Cómo se saca el texto con tiempos por palabra. Lo corre `video.py transcribir` con el python de `P4F_PYTHON_VOZ`."
    modelo: "small"
    _modelo_origen: "el de faster-whisper con el que se transcribieron los dos clips reales (IAvanza, 20-sep-2026, y WhatsApp, 21-sep-2026). 484 MB, se baja la primera vez."
    vocabulario:
      - "Pitch 4 Fun"
      - "Enlata"
      - "IAvanza"
    _vocabulario_origen: "se le pasa a whisper como `hotwords` para que escriba bien los nombres propios. Medido el 23-sep-2026 sobre el clip de WhatsApp, mismo modelo y mismo audio: sin vocabulario, «Pitch 4 Fun» salía bien escrito 0 de 2 veces («Pitch for Phone») y 10 de 71 palabras quedaban por debajo de 0.50 de confianza; con él, 2 de 2 y 7 de 71. `initial_prompt` también lo arreglaba, con 8 dudosas. Es un clip: lo que aguante en otros está por medir."
    confianza_min: 0.5
    _confianza_origen: "por debajo de esto una palabra se marca como DUDOSA al trocear y al montar, con su tiempo, para que alguien la escuche antes de publicar. En el clip de WhatsApp las cuatro dudas reales (un nombre propio, una palabra que no existe, un género dudoso y «sistema» a 0.04) estaban todas en esa lista. Una palabra corregida a mano en `video.correcciones` ya no se marca: alguien la escuchó."
  mezzanine:
    _que_es: "Una sola codificación limpia de la que luego se corta. Cortar del original obliga a decodificar el crudo en cada corte y a arrastrar su color y su ruido a todas las piezas."
    px:
      - 1080
      - 1920
    fps: 30
    crf: 16
    preset: "medium"
    denoise: "hqdn3d=2:1.5:3:3"
    enfoque: "unsharp=5:5:0.7:5:5:0.0"
    escala: "scale=1080:1920:flags=lanczos:force_original_aspect_ratio=increase"
    etiquetado:
      - "-color_range"
      - "tv"
      - "-colorspace"
      - "bt709"
      - "-color_primaries"
      - "bt709"
      - "-color_trc"
      - "bt709"
    _etiquetado_origen: "sin etiquetar, cada reproductor decide el espacio de color por su cuenta y la misma pieza se ve distinta en dos teléfonos."
    estabilizar: false
    _estabilizar_origen: "estabilizar recorta, y una fuente de teléfono ya suele venir justa. Si el clip viene movido de verdad se decide por clip, no por defecto."
    encuadre: "crop=1080:1920"
    _encuadre_origen: "⚠️ El escalado CONSERVA la proporción y luego se recorta. La primera versión era `scale=1080:1920` a secas, heredado de la corrida DTW, donde la fuente ya venía vertical. Con una fuente horizontal —el clip real de 1620×1080— eso no recorta: ESTIRA la cara. Un logo no se deforma para cuadrar con una caja y una cara tampoco. Lo que se pierde por los lados el módulo lo DICE al medir: recortar es una decisión, no un efecto secundario."
    voz:
      - "highpass=f=80"
      - "volume={ganancia_db}dB"
      - "{ruido}"
      - "acompressor=threshold=-20dB:ratio=3:attack=8:release=180:makeup=3"
      - "alimiter=limit={limite_db}dB:level=false:latency=1"
    _latencia_origen: "`latency=1` porque el limitador mira 5 ms por delante y, sin compensarlo, deja la voz esos 5 ms tarde respecto a la imagen: 239 muestras a 48 kHz medidas con un clic, y 4.96 ms en el maestro de WhatsApp de la pieza 7 (24-sep-2026). Con `latency=1`, 0 muestras. La prueba `ruido · la cadena de voz no retrasa` lo vigila."
    _voz_origen: "la cadena de voz de la corrida DTW más tres piezas que salieron de MEDIR este clip, no de leer nada. El clip real entra a −38.76 LUFS con los picos en −1.30 dBTP: 37 dB de diferencia entre la voz y los transitorios.\\n1. `volume` con la ganancia medida (`maestro.lufs − lo medido en la fuente`, aquí +24.76 dB). Sin ella el compresor no sirve de nada: su umbral está en −20 dB y la voz entraba a −38, o sea que no se activaba nunca. Con el compresor solo, la pieza salía a −16.04.\\n2. `alimiter` DESPUÉS del compresor. Subida la ganancia, los picos se iban a +23.92 dBTP y `loudnorm` tenía que bajar la pieza entera para respetarlos: −15.82. Un compresor no coge un transitorio; un limitador sí. Medido sobre 40 s del clip: sin limitador los picos llegan a `loudnorm` a +9.93 dBTP y con él a −1.00.\\n3. `loudnorm` en DOS pasadas sobre la cadena COMPLETA. Medir la fuente cruda y corregir con eso no vale cuando delante hay cuatro filtros: con una sola pasada salía −14.66."
    _voz_aviso: "ningún reductor de ffmpeg quita eco de sala. Si el clip viene con reverberación hace falta otra cosa —en DTW se usó DeepFilterNet— y eso se decide por clip, no por defecto."
    holgura_limitador_db: 0.5
    _limite_origen: "el limitador se pone 0.5 dB POR ENCIMA del techo del maestro (−1.5 + 0.5 = −1.0 dBFS). No en el techo mismo: `loudnorm` va detrás y necesita sitio para trabajar. Y no más arriba, o vuelve a dejarle picos que bajar."
    _ruido_hueco: "`{ruido}` no es un filtro: es el sitio donde ENTRA el reductor si la medición dice que gana, y donde no entra nada si dice que no. Ver `limpieza.ruido`.\\n⚠️ Va DESPUÉS de `volume`, y es medido (24-sep-2026). En af_anlmdn.c el peso de cada parche es exp(−SSD·sw) con sw ∝ 1/√s, y la SSD crece con el cuadrado de la amplitud: la misma `s` pesa g⁴ veces más en un clip g veces más bajo. Antes de la ganancia, el candidato era unas 80 000 veces más fuerte en IAvanza (entra a −38.8 LUFS) que en WhatsApp (−14.3): en uno limpiaba y en el otro no hacía nada. Después de `volume` todos los clips le llegan a la misma sonoridad."
  grade:
    sistema: "gew_design_system/tokens/video.json"
    look: "base"
    _look_origen: "el look por defecto del sistema GEW, que es la fuente única de los tres motores desde el 6-sep-2026. P4F no tiene motivo para el `calido` —que existe para luz de tungsteno— así que usa el mismo que todo lo demás."
    respaldo: "eq=brightness=0.03:contrast=1.09:saturation=1.05:gamma=1.04"
    respaldo_colorbalance: "colorbalance=rm=-0.05:gm=-0.02:bm=0.07:rs=-0.02:bs=0.05"
    _respaldo_origen: "los mismos valores que GEW declara para `base`, escritos aquí para que una copia de P4F sin el sistema GEW al lado siga corriendo. Si se usa el respaldo, el módulo lo DICE al entregar: deja de estar unificado."
  cortes:
    frontera: "palabra"
    _frontera_origen: "de la corrida DTW: cortar a mitad de sílaba se oye aunque la imagen encaje. Los límites salen de los tiempos por palabra de la transcripción."
    bloque_min_s: 0.83
    bloque_max_s: 3.0
    caracteres_por_segundo_max: 17
    _bloque_origen: "Piero, 10-sep-2026, en el sistema de cobertura de evento. El bloque lo decide el motor, no la transcripción: whisper devuelve segmentos de hasta 16 s que nadie puede leer. ⚠️ No hay estudio publicado que mida estos números contra retención; se usan porque arreglan los bloques largos."
    adelanto_s: 0.06
    _adelanto_origen: "el subtítulo entra 60 ms antes de que se diga la palabra. Leerlo después de oírlo se nota; leerlo justo antes, no. Piero, 10-sep-2026, en el sistema de cobertura de evento."
    pausa_min_s: 0.25
    _pausa_origen: "un hueco de 250 ms entre dos palabras ya es una pausa que se oye. Cuando el bloque está lleno se cierra en la última pausa disponible, no en la palabra que tocaba: cortar entre «sus» y «productos» es correcto por longitud y se lee mal. Es la regla «cortar en la pausa» de la corrida DTW, que allí se aplicaba a mano afinando los BOUNDS beat a beat."
    sostener_max_s: 0.5
    _sostener_origen: "un bloque puede quedarse en pantalla hasta medio segundo después de la última palabra, y nunca más allá del comienzo del siguiente. Sirve para los tramos en los que se habla rápido: bajar los caracteres por segundo sin tocar lo que se dice. No se estira el que ya va holgado."
    no_cierran_bloque:
      - "a"
      - "al"
      - "con"
      - "de"
      - "del"
      - "el"
      - "en"
      - "la"
      - "las"
      - "lo"
      - "los"
      - "mi"
      - "o"
      - "para"
      - "por"
      - "que"
      - "se"
      - "su"
      - "sus"
      - "tu"
      - "un"
      - "una"
      - "unas"
      - "unos"
      - "y"
    _no_cierran_origen: "segunda preferencia al cerrar un bloque, cuando NO hay ninguna pausa donde cortar. Medido sobre el clip real: un tramo de nueve palabras se dice de corrido, sin un solo hueco de 250 ms, y el bloque cerraba en «sus» dejando huérfano el sustantivo en el siguiente. Un artículo o una preposición al final de un subtítulo obliga a leer el salto dos veces. Si ni así hay sitio, se corta donde toque: un bloque que no cabe es peor que uno que cierra mal."
  musica:
    bajo_voz: "cama"
    sin_voz: "solo"
    _origen: "las dos versiones ya están medidas en `tokens.audio`: `cama` a −30 LUFS para ir debajo de la voz y `solo` a −16 para los tramos sin voz. NO hay ducking: la cama es constante. Es la preferencia que Piero fijó en la corrida DTW —«no debe subir y bajar»— y la misma que declara `tokens/video.json` de GEW."
    fade_out_s: 1.5
    entrada_umbral_lu: 6.0
    _entrada_origen: "La cama empieza donde ENTRA la pista, no en su segundo 0. Medido el 24-sep-2026 con ebur128: `Open_Window_Theory-cama` va a −46/−48 LUFS (corta de 3 s) hasta el 11.2 s y ahí salta a −30; `Measured_Intent-cama` va a −39/−44 hasta el 14.3 s. Arrancando en 0, la voz quedaba 33.4 LU por encima de la cama en el concierto (9.8 s) y 24.9 en la GEW: la música no se oía. La entrada es el primer instante en que la momentánea llega a 6 LU del integrado de la pista y la corta de los 3 s siguientes también: 6 deja fuera los golpes sueltos de la intro (−42.8 y −43.1 en OWT, con el integrado en −30.0) y entra en el primer tramo sostenido. Nunca tan tarde que la pista se acabe antes que la pieza."
    entrada_preroll_s: 0.05
    _preroll_origen: "la cama arranca 50 ms antes del golpe, con un fundido de entrada de esos mismos 50 ms: el ataque del primer golpe queda entero y no hay chasquido por cortar la onda a media amplitud. Lo que suena en esos 50 ms es la intro, a −46 LUFS."
    bajo_voz_lu: 12.0
    _bajo_voz_origen: "la distancia voz–cama, medida en el cuerpo. Piero, 25-sep-2026, al oír las cuatro piezas a 14 LU: «la música súbela 2 dB» → 12 LU. El 14 de antes salía de `audio.objetivo_cama`: −30 LUFS de cama bajo una voz a −16, el margen en el que la música acompaña sin tapar. La voz de estas piezas sale del maestro a −13, así que lo que se fija es la DISTANCIA, no el −30."
    ajuste_max_db: 8.0
    _ajuste_origen: "la ganancia fija que se le pone a la cama, medida sobre el tramo que suena, para quedar a `bajo_voz_lu` de la voz: como mucho ±8 dB. Fija para toda la pieza: sin ducking, «no debe subir y bajar» (Piero, corrida DTW). Era ±6 con el objetivo en 14 LU, y las cuatro piezas del 24-sep pedían de +3.16 a +3.82 dB; con 12 LU piden unos 2 dB más, y 6 dejaba menos de medio dB de margen. Si hiciera falta más de 8, la pista no sirve de cama para ese clip y `medir` lo marca en vez de subirla a ciegas."
    tolerancia_lu: 1.5
    _tolerancia_origen: "cuánto puede separarse la distancia medida del objetivo antes de que `medir` diga FUERA. 1.5 LU es menos de lo que se distingue a oído en una cama; más, y ya no es la cama que se diseñó."
  pasos:
    - "mezzanine"
    - "transcribir"
    - "guion"
    - "limpiar"
    - "subtitulos"
    - "montar"
    - "medir"
  _pasos_origen: "los 9 pasos de la skill `invitacion-dtw` colapsados a 6: los de gráficas branded (endcard, títulos) ya no son pasos porque los dibuja `historias.py` desde tokens, y los captions no son edición de vídeo."
  _sin_ffmpeg_full: "este proceso NO necesita `ffmpeg-full`. El de DTW sí, porque quemaba el subtítulo con libass; aquí el subtítulo es un PNG del propio sistema y basta con `overlay`, que trae cualquier ffmpeg."
  subtitulo:
    variante: "placa"
    _variante_origen: "`placa` es la única de las tres que mide 16.88 de contraste pase lo que pase debajo, porque es opaca. `velo` y `resalte` dependen del fotograma. Sobre un clip que no se ha visto, la que no depende del fotograma es la única defendible."
    banda_por_defecto: "baja"
    _banda_origen: "la de por defecto del componente: nada más compite por la parte de abajo del frame."
    durante_titulo: "ocultar"
    _durante_titulo_valores:
      - "ocultar"
      - "banda_media"
    _durante_titulo_origen: "⚠️ Mientras el frame de `titulo` está encima, SU placa ocupa la banda baja. Los subtítulos del cuerpo salían en la misma banda y se dibujaban uno encima de otro: se vio en un fotograma del primer montaje con clip real, no en ninguna medida. `ocultar` es lo correcto por defecto: durante esos segundos el mensaje es el del título, que es una frase escrita, no la transcripción. `banda_media` los sube a 1380 si de verdad hace falta que se lea lo que se está diciendo. Lo que se oculta se DICE al montar: un subtítulo que desaparece sin avisar es peor que uno mal puesto."
    bandas_si_cara:
      - "media"
      - "alta"
    _bandas_si_cara_origen: "Adónde va un subtítulo cuya placa taparía una cara, en este orden, desde el 24-sep-2026: el plano ya no se aleja para dejarle sitio (Piero: solo por el logo) y «el texto nunca tapa un rostro» sigue siendo regla. La banda `alta` es la que el componente declara para esto: «cuando la mitad inferior del encuadre es la acción: el rostro en plano cerrado». Se decide por bloque, con las caras que se ven mientras está en pantalla y la PLACA entera (opaca), con la holgura del detector. Si ninguna banda está libre, va a la que menos pisa y `medir` lo marca. Medido a sangre en la GEW: la cara entra en la banda baja en 16 de 121 muestras."
  encuadre:
    _que_es: "Dónde cae la cara dentro del lienzo vertical. No es un recorte centrado: se detecta el rostro, se mide dónde está a lo largo del clip y se coloca."
    _por_que: "Medido sobre el primer montaje con clip real: con el recorte centrado la coronilla llegaba a y=202 —dentro de los 269 px que tapa la app— y el lockup del título caía SOBRE la cara en los primeros 8 s. Las dos cosas rompen reglas que este sistema ya tiene escritas: la zona segura y «el texto nunca tapa un rostro»."
    modo: "cara"
    _modo_valores:
      - "cara"
      - "centro"
    _modo_nota: "`centro` es el recorte de siempre. `cara` necesita el detector; si no está, se cae a `centro` y se DICE. Sin cara detectada tampoco se inventa: se centra y el informe lo dice."
    alejar: 1.0
    _alejar_origen: "MÁXIMO del CUERPO, y es 1.00: el cuerpo va a sangre. Piero, 24-sep-2026: «¿por qué se reduce el tamaño del video y se monta el borde difuminado? Esto se debe evitar, solo se hace cuando el logo impacta en el rostro». Hasta ese día este máximo era el techo de un solucionador que alejaba TODO el clip por cuatro reglas —coronilla, cara cortada, placa del subtítulo y logo—: los dos verticales del 24-sep salieron al 83 % y al 59.7 %, el de IAvanza al 92.2 % y el de WhatsApp al 97.5 %, y en ninguno era por el logo en todo el clip. Antes, 21-sep: «los bordes difuminados los evitamos a menos que sea estrictamente necesario alejar la cámara o encuadrar». Ver `_solo_logo`."
    ojos_en: 0.38
    _ojos_origen: "los ojos a 0.38 del alto, contando desde arriba. Es el criterio del módulo de encuadre de GEW (`encuadre.py`), donde está escrito: el tercio clásico baja un poco para dejar más aire abajo, que aquí es donde va el subtítulo."
    aire_coronilla_px: 40
    _aire_origen: "la coronilla no se acerca a la zona segura a menos de 40 px, ni en el fotograma en el que la cabeza está más alta. Se comprueba contra los EXTREMOS del clip, no contra la media: el hablante se mueve, y en este clip la coronilla viaja 218 px entre el segundo 2 y el 16. Desde el 24-sep-2026 esto se DICE y no aleja el plano: solo el logo lo aleja, y solo bajo el título (ver `_solo_logo`)."
    despejar_logo: true
    _despejar_origen: "la cara no se solapa con la caja del lockup del título. Si centrarla la mete debajo del logo, se desplaza a la derecha lo justo: el logo vive arriba a la izquierda y un rostro a la derecha es una composición, no un apaño."
    muestras: 8
    _muestras_origen: "el SUELO de fotogramas para un tramo corto. Hasta el 23-sep-2026 eran los únicos ocho que se miraban, y no bastaban: ver `fps_muestreo`."
    holgura_medida_px: 20
    _holgura_medida_origen: "el margen que el solucionador deja en las CUATRO reglas por encima de lo que piden, porque la caja del detector no es exacta. Medido el 23-sep-2026 en los mismos instantes: la coronilla detectada en el lienzo ya montado se separa de la predicha desde la fuente entre −29 y +34 px en el clip de WhatsApp y entre −23 y +15 en el de IAvanza (p5 −17 y −14), y el borde izquierdo ±23. Con holgura 0 la regla salía justa en la muestra y el comprobador independiente la veía rota por 1 y 4 px en otro fotograma. 20 cubre el p5 de los dos clips. La comprobación final de `medir` aplica las reglas SIN esta holgura: esto sirve para que pase, no para aflojarla. Desde el 24-sep-2026 se usa para colocar el plano del título respecto al logo y a su placa, para no recortar una cara con el recorte a sangre y para elegir la banda del subtítulo."
    fps_muestreo: 10
    _fps_muestreo_origen: "fotogramas por segundo que se miran, en el encuadre y en la comprobación final de `medir`. Medido sobre el clip de WhatsApp el 21/23-sep-2026: con 8 muestras el plano elegido cambiaba con el número de muestras (8/16/24/40 → 0.974/0.919/0.806/0.785), y a 4 por segundo no se vio ninguno de los 4 fallos que a los 16.63 nativos sí salieron (3 caras cortadas y una coronilla en la zona segura, con el plano a sangre). 10 es el compromiso con el tiempo del detector en clips largos: 152 s son 1520 fotogramas."
    fondo: "gblur=sigma=28"
    _fondo_origen: "al alejar el plano sobran franjas arriba y abajo. Se rellenan con el propio fotograma a sangre y desenfocado: negro cortaría la pieza en tres y un color plano no es de la marca. Es lo que se hizo en los reels de la GEW."
    detector: "herramientas-rostro.swift"
    _detector_origen: "el detector de Vision de macOS de P4F: `herramientas-rostro.swift`, que `video._detector()` compila la primera vez en `_derivados/herramientas/rostro`. Hasta el 25-sep-2026 era el del sistema GEW, y una copia de P4F sin GEW al lado encuadraba al centro: ese día Piero decidió que P4F tenga el suyo, siempre. Es el mismo código, y da las mismas cajas, ojos y confianzas (0.0 px sobre 220 fotogramas). ⚠️ Detecta CAJAS, no identidades: se usa para no tapar una cara y para colocarla, nunca para agrupar ni identificar a nadie. Decisión de Piero del 6-sep-2026."
    alejar_min: 0.55
    _alejar_min_origen: "el suelo del plano BAJO EL TÍTULO, lo único que todavía se aleja. Si ni ahí se despeja el logo, se deja de alejar y se DICE. Por debajo de 0.55 el sujeto ocupa menos de la mitad del lienzo y la pieza es más desenfoque que vídeo."
    _resolver: "1 · el cuerpo a sangre, con el recorte que menos muestras rompe (cara cortada por el encuadre, luego coronilla, luego placa) y, a igualdad, el más cerca de la cara centrada con los ojos a `ojos_en`. 2 · si bajo el título el lockup toca la cara, primero un recorte a sangre para todo el clip que lo despeje sin cortar más caras (un rostro a la derecha del logo es una composición). 3 · si no lo hay, el plano más cerrado que despeja el logo SOLO bajo el título, cumpliendo también la cara entera y la placa del título; si no caben, se sueltan la placa y luego la cara entera, y se dice. Una cara cortada solo cuenta si la corta un borde detrás del cual la fuente sigue: por el borde del propio clip ya venía cortada."
    _solo_logo: "Qué puede alejar el plano, desde el 24-sep-2026: SOLO el lockup del título tocando la cara, y SOLO mientras está el título. Medido a sangre sobre los cuatro clips de esa semana (holgura del detector incluida): el logo tocaba la cara en 31 de 50 muestras bajo el título en IAvanza y en 5 de 50 en la GEW; en WhatsApp y en el concierto, en 0. En IAvanza un recorte corrido a sangre despejaba el logo pero cortaba la cara por la derecha; en la GEW, vertical, no hay nada que correr. Lo demás ya no aleja: la coronilla bajo la franja de la app se DICE; una cara cortada en el original no se arregla alejando (el concierto se alejaba al 83 % por 14 muestras con la cara ya fuera del clip); y el subtítulo que taparía una cara cambia de banda (`video.subtitulo.bandas_si_cara`). Cuando se aleja bajo el título, el plano vuelve a sangre en el mismo fotograma en que el título se va: un cambio de plano pegado a la salida del título. Piero, 25-sep-2026, después de verlo en la GEW: «deja el salto al irse el título en GEW como está»."
  portada:
    _que_es: "Cómo elige la cadena la portada de una pieza (`video.portadas`): `portada.png` y dos candidatas más. Piero delegó la elección el 24-sep-2026 («evalúalos y toma la que mejore»). Cada fotograma se mide con `herramientas-portada.swift` (Vision y Core Image de macOS). Mide cómo sale la cara, nunca quién es."
    _por_que: "hasta el 24-sep-2026 se elegía solo por nitidez, y la portada de IAvanza salió con los párpados a media asta y la boca a media palabra (18.5 s). La nitidez no ve ni un ojo cerrado ni una boca abierta."
    fps: 5
    _fps_origen: "los párpados cambian en décimas: en IAvanza, a 18.4 s los ojos están abiertos y a 18.5 s a media asta. A 2 por segundo se eligió el de 18.5. A 5 por segundo son 115 fotogramas en los 23 s del cuerpo."
    boca_max: 0.06
    _boca_origen: "alto de la abertura entre los labios partido por el ancho de la boca. Medido en IAvanza: boca cerrada 0.020 a 0.049 (15.5, 22.4 y 10.0 s); a media palabra 0.114 (18.5 s); abierta 0.367 (4.0 s). Una sonrisa enseña los dientes y abre la boca, así que sonreír también pasa."
    yaw_max: 20
    _yaw_origen: "grados de giro a los lados. Mirado en WhatsApp: a −8° y −15° mira a cámara; a −22° ya mira a otro lado, y es justo el fotograma con la nota de Apple más alta del clip (0.49). La nota sola habría elegido una portada mirando fuera."
    roll_max: 15
    _roll_origen: "grados de cabeza ladeada. Mirado en WhatsApp: a 10° pasa; a 16° ya se ve torcida."
    pitch_max: 20
    _pitch_origen: "grados de cabeza arriba o abajo. Un selfi se graba desde abajo: de −16° a +6° se ven bien (WhatsApp e IAvanza), y el más bajo de WhatsApp es −20°."
    _calidad: "la nota de calidad de captura de Vision, de 0 a 1, tiene que estar por encima de la MEDIANA del clip. Es una nota para comparar fotos de una misma toma, no un aprobado absoluto, por eso el corte es relativo. Deja fuera lo movido que la nitidez no veía (WhatsApp, 6.6 s: nota 0.22 con la mediana en 0.34) y el 18.5 s de IAvanza (0.42 con la mediana en 0.51)."
    _ojos: "un ojo cerrado lo dice Core Image (`leftEyeClosed`/`rightEyeClosed`) y el fotograma queda fuera: caza el parpadeo del 4.0 s de IAvanza. ⚠️ Los párpados a media asta no los ven con fiabilidad ni Vision ni Core Image: los deja fuera la nota de calidad, no una medida de ojos."
    _orden: "delante los que sonríen (Core Image, `hasSmile`) y, entre ellos, la nota más alta. Separadas `separacion_s` para que no sean tres veces el mismo gesto."
    separacion_s: 3.0
    n: 3
    cede:
      - "otra_cortada"
      - "pose"
      - "boca"
      - "calidad"
    _cede_origen: "si ningún fotograma pasa todo, se afloja un filtro cada vez, en este orden, y la cadena dice cuál cedió. Primero la otra cara cortada, que es composición; la calidad lo último. Los ojos cerrados y la cara principal cortada no ceden nunca."
    _movida: "De las candidatas que pasan todo lo demás, se queda la mitad con el fotograma ENTERO más nítido (varianza de bordes a 270×480). La nota de Apple mira la cara y no ve lo que pasa delante. Medido el 24-sep-2026, al sacar la portada del original: la de WhatsApp pasó a una del 3.3 s con una mano movida delante de la otra cara, empatada en nota (0.469) con la del 25.0 s. Nitidez 508 contra 703, con la mediana de las 28 que pasaban en 674. Con el filtro vuelve la del 25.0 s; la de la GEW no cambia (6.9 s) y la del concierto pasa del 9.4 al 9.0 s. Nunca vacía la lista: no necesita ceder."
    _origen_de: "Desde el 24-sep-2026 las candidatas salen del clip ORIGINAL, a sangre y centradas cada una en su cara, con el mismo tratamiento de imagen que el maestro. Piero: «saca la portada del original». La de la GEW salía del cuerpo alejado al 59.7 %, con 330 px de desenfoque por lado."
  limpieza:
    _que_es: "Qué se le quita al clip antes de montarlo: tiempo muerto, retomas y ruido. Todo sale de los TIEMPOS POR PALABRA de la transcripción, no de detectar silencio por energía."
    _por_que_no_por_energia: "las tres herramientas de referencia —auto-editor (Unlicense, activa), unsilence (MIT, último release nov-2022) y jumpcutter (MIT, abandonado en 2021)— deciden por umbral de volumen; ninguna usa VAD. Nosotros ya sabemos dónde acaba cada palabra y dónde empieza la siguiente, que es mejor información que el nivel de señal. Y `silenceremove` de ffmpeg es SOLO de audio: no toca el vídeo."
    hueco_max_s: 0.4
    _hueco_origen: "la pausa natural entre frases tiene una mediana de 398–471 ms y una media de 487–553 ms (Šturm & Volín, 2023, mdpi.com/2226-471X/8/1/23). Recortar por debajo de eso deja el habla más apretada que su propia pausa natural y suena atropellado. ⚠️ La primera versión de esta regla iba a poner 0.25 s: lo corrigió la investigación, no la escucha."
    margen_corte_s: 0.2
    _margen_origen: "0.2 s a cada lado de cada corte. Es el `--margin` por defecto de auto-editor (auto-editor.com/ref/options), y sus propios usuarios lo suben a 0.1–0.5 s cuando el corte se come el final de una palabra."
    crossfade_s: 0.003
    _crossfade_origen: "3 ms bastan para que una unión de audio no haga clic (Sound on Sound, soundonsound.com/techniques/removing-clicks-crossfades-sonar). El defecto de `acrossfade` de ffmpeg es de 1000 ms: mil veces más de lo que hace falta."
    cuadrar_a_fotograma: true
    _cuadrar_origen: "⚠️ REGLA DURA, y está medida sobre el clip real: concatenar 20 cortes en frontera de palabra da **+575 ms de deriva** —casi un fotograma por corte— y los subtítulos se despegan de la voz. Cuadrando cada extremo a un múltiplo exacto de 1/fps antes de cortar, la deriva baja a **−1 ms** y salen 2476 fotogramas de 2476 esperados. Es el frente 1 del workspace hecho token: «`-t` no corta en fotogramas enteros»."
    retomas:
      _que_es: "Cuando se dice lo mismo dos veces: una toma fallida y su repetición."
      palabras_min: 5
      _palabras_min_origen: "cinco palabras seguidas idénticas ya no es casualidad del idioma. Con cuatro entran frases hechas, que un orador repite a propósito."
      se_queda: "ultima"
      _se_queda_origen: "Piero, 20-sep-2026: ante dos tomas de lo mismo se queda la SEGUNDA. La que viene después del titubeo suele ser la buena. Lo quitado se declara siempre, con sus tiempos: una retoma que desaparece sin avisar es un corte que nadie aprobó."
      _medido: "en el clip de prueba: 11 palabras idénticas entre 1.56–5.16 s y 57.24–60.76 s, más otras siete secuencias. Unos 15 s de 150."
    ruido:
      _que_es: "El reductor de ruido NO va en la cadena por defecto: se prueba en cada clip, sobre el tramo que se usa, y solo entra si DNSMOS dice que gana sin costar voz."
      _hallazgo: "⚠️ Resuelto con DNSMOS el 24-sep-2026: el SNR hablado no medía lo que hace `anlmdn`, medía qué palabras le tocaban. En WhatsApp dio −0.0 dB con una transcripción, y con la siguiente no pudo medir (solo 2 huecos de 0.45 s); en IAvanza, con la transcripción entera, +4.6 dB, y la puerta se habría abierto. Con DNSMOS a −25 dBFS y el reductor después de la ganancia, sobre los tramos que se usan (lo que mide `pieza`), `anlmdn` s=3000 sube el fondo +1.09 (IAvanza) y +0.77 (WhatsApp) y la nota global +0.25 y +0.12, y la voz BAJA −0.34 y −0.31; en el laboratorio, en IAvanza, en 13 de 13 trozos. Limpia de verdad, y cuesta voz. Lo de `afftdn` sí era cosa del material: +0.02 de nota global en IAvanza entero y en WhatsApp, y sobre ruido rosa añadido a 20 dB, +0.43 a +0.54. Quita ruido constante, y este material no lo tiene."
      _la_medida_ve: "Probado en las dos direcciones antes de fiarse de ella: con ruido rosa añadido a 20 dB la nota global de WhatsApp baja de 2.22 a 1.55, y con zumbido a 15 dB a 2.09; y un reductor sobre ese ruido la sube (`anlmdn` s=100 +0.70, s=1000 +0.84). Ve el ruido, y ve cuándo se quita."
      modo: "medido"
      _modo_valores:
        - "medido"
        - "siempre"
        - "nunca"
      _modo_origen: "`medido` prueba el candidato sobre ESTE clip y lo deja fuera si no gana. Es una puerta de seguridad: su trabajo es impedir que entre un filtro que estropea, no garantizar que entre alguno."
      candidato: "anlmdn=s=3000:p=0.01"
      _candidato_origen: "barrido de s = 300, 1000, 3000 y 10000 después de la ganancia, puntuado con DNSMOS en los tramos de WhatsApp y de IAvanza (24-sep-2026). De 300 a 3000 la nota global sube en IAvanza (+0.03 → +0.29); de 3000 a 10000 casi no cambia (+0.29 → +0.34 en IAvanza, +0.20 → +0.20 en WhatsApp), y 10000 es el tope del filtro. `afftdn` y `afwtdn` quedaron fuera por medición, no por opinión. `p=0.01` viene del barrido anterior. El `s=0.01` de antes estaba puesto ANTES de la ganancia, y ahí la fuerza dependía del nivel del clip (ver `mezzanine._ruido_hueco`)."
      gana_min_ovrl: 0.1
      _gana_min_origen: "la nota global tiene que subir al menos 0.1 en la PEOR de las cuatro rejillas. Es más de lo que baila la diferencia en IAvanza al mover la rejilla (0.04 a 0.07). En WhatsApp baila hasta 0.16, y por eso se decide con la peor rejilla y no con la media."
      pierde_max_sig: 0.1
      _pierde_max_origen: "la voz no puede bajar más de 0.1 en la peor rejilla: más de lo que baila su diferencia en IAvanza al mover la rejilla (0.06 a 0.08), o sea, sin pérdida medible. Es la idea del viejo `pierde_max_db` —«más de 1 dB de voz perdida ya no es limpiar, es bajar lo que importa»— en la escala de DNSMOS. ⚠️ DECIDE PIERO si cambia: con 0.40 el reductor entra en IAvanza (voz −0.34, −0.39 en la peor rejilla; fondo +1.09; global +0.25). En WhatsApp no entra ni así: en la peor rejilla la nota global solo sube +0.03. Cuando la voz es lo único que lo frena, la cadena deja `ruido-sin.m4a` y `ruido-con.m4a` para oírlo."
      dnsmos:
        _que_es: "DNSMOS P.835 de Microsoft: nota de 1 a 5 sin señal de referencia, en tres partes. SIG es la voz, BAK el fondo y OVRL el conjunto. Corre con el python de `P4F_PYTHON_VOZ`: onnxruntime ya viene con faster-whisper."
        modelo: "~/.p4f/dnsmos/sig_bak_ovr.onnx"
        sha256: "269fbebdb513aa23cddfbb593542ecc540284a91849ac50516870e1ac78f6edd"
        _modelo_origen: "github.com/microsoft/DNS-Challenge, DNSMOS/DNSMOS/sig_bak_ovr.onnx: 1 157 965 bytes, bajado el 24-sep-2026 con permiso de Piero. Licencia CC BY 4.0. No va en el repo, porque el repo es público y el modelo es de Microsoft. Si el fichero no tiene este sha256, la puerta no mide."
        nivel_dbfs: -25
        _nivel_origen: "DNSMOS depende del nivel. El mismo audio de WhatsApp da nota global 2.03 a −13 LUFS, 2.24 a −23 y 1.92 a −33. Y la diferencia con y sin reductor puede cambiar de signo: en el tramo de IAvanza, s=100 da +0.30 a −13 LUFS y −0.01 a −25 dBFS. −25 dBFS RMS es el nivel al que DNS-Challenge normaliza (audiolib.normalize, target_level=−25), en el centro de lo que el modelo vio al entrenar (de −35 a −15, noisyspeech_synthesizer.cfg). −13 LUFS son −13.5 dBFS RMS: fuera."
        rejillas_s:
          - 0
          - 0.25
          - 0.5
          - 0.75
        _rejillas_origen: "el modelo mira trozos de 9.01 s con salto de 1 s. En un clip de 26.7 s son 17 trozos, y empezar un cuarto de segundo después mueve la nota global hasta 0.16 (WhatsApp). Se puntúa en las cuatro rejillas y se decide con la peor."
        _p808: "`model_v8.onnx` (P.808) se bajó junto al otro y no se usa: su entrada es el mel de librosa, y una réplica no se puede comprobar sin instalar librosa."
      _sin_dereverb: "no hay desreverberación y es a propósito: ffmpeg no tiene filtro de dereverb, DeepFilterNet lleva parado desde ago-2024 y para Apple Silicon solo hay puertos no oficiales."
    _medir_que_mejoro: "una limpieza que suena distinta no es una limpieza que mejoró. PESQ y STOI necesitan la señal limpia de referencia, y aquí no existe. DNSMOS no la necesita, y desde el 24-sep-2026 es el juez de la puerta (`ruido.dnsmos`)."
  _maestro_formato: "⚠️ El formato de ENTREGA se fuerza, no se hereda. La fuente de prueba es mono a 44.1 kHz y el mono se propagaba por toda la cadena hasta la pieza final —que además salió a 96 kHz—. Es la trampa que el frente 1 del taller ya tenía escrita: «R128 suma canales: medir en estéreo y entregar mono deja la ganancia corta». `amix` tampoco salva: toma la disposición de su PRIMERA entrada, y si la voz entra en mono, sale mono aunque la cama sea estéreo."
  desfase_max_ms: 40
  _desfase_origen: "⚠️ El audio y el vídeo tienen que acabar a la vez. 40 ms es poco más de un fotograma a 30 fps: por debajo de eso nadie lo nota y por encima empieza a verse en los labios. Medido: la pieza de 26 s salía con 2 ms y la de 141 s con **549**, porque `montar` tomaba la duración del CONTENEDOR —que la marca el flujo más largo— en vez de la del vídeo, y luego rellenaba el audio hasta ahí. El clip limpio ya entra con +21 ms de retraso del codificador AAC, y ese error se arrastraba y se multiplicaba."

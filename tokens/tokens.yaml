    titulo:
      px:
        - 1080
        - 1920
      alfa: true
      banda_subtitulo: "baja"
      variante_subtitulo: "placa"
      segundos: 5.0
      uso: "overlay de apertura: SOLO el lockup a color arriba a la izquierda, sobre alfa, y el subtítulo en su banda. Decisión de Piero (19-sep-2026): fuera el velo y fuera las dos líneas de apoyo que llevaba la primera versión."
      logo_ancho_px: 385
      logo_x_px: 72
      logo_tope_y_px: 290
      _logo_origen: "el boceto pone el lockup en x 117..502 (385 de ancho) con el tope de tinta en y=129. Se respeta el ANCHO. La x va al margen del sistema (72), que es donde arranca todo lo demás de P4F. El tope sube de 129 a 290 porque 129 cae DENTRO de los 269 px que tapa Instagram: 161 px del logo quedaban debajo de la interfaz de la app."
      logo_variante: "p4f-lockup-color-dark.svg"
      _variante_origen: "`color-dark` es el lockup a color CON EL TEXTO EN BLANCO —#FFFFFF, #0595F0 y #83CE00—, que es el que va sobre oscuro. El otro a color (`p4f-lockup-color.svg`) lleva el texto en ink y desaparecería sobre un fotograma oscuro."
      _sin_velo: "⚠️ SIN VELO por decisión de Piero. Es lo que hace que el logo se lea o no según el fotograma: su texto es blanco, y sobre un plano claro baja de contraste. Medido en el modo `sobre-foto`. La primera versión llevaba velo justo por eso; queda aquí escrito para que el día que aparezca el problema se sepa de dónde viene y no se busque en otro sitio."
      logo_sin_velo: true
      _logo_sin_velo_nota: "DECISIÓN DE PIERO (19-sep-2026): el logo va suelto sobre el fotograma. Medido contra los 10 de control, el blanco del lockup baja a 1.00 sobre blanco puro, el azul a 1.23 sobre gris medio y el verde a 1.95. Sobre plano oscuro va de 5.28 a 6.56. El control `sobre-foto` lo reporta como AVISO en esta pieza y no como fallo, porque la decisión está tomada — pero sigue dando el número en cada corrida: una decisión no deja de tener consecuencias por estar decidida."
      _segundos_origen: "subida de 3.0 a 5.0 por Piero, 19-sep-2026."
      entrada:
        _que_es: "El movimiento de entrada del frame de título: el lockup y la placa del subtítulo aparecen por su cuenta."
        _forma: "el MISMO lenguaje que el end card —fade y subida de 48 px con ease-out cúbica—, a propósito. Dos movimientos distintos en la misma pieza de vídeo se leen como dos marcas."
        curva: "ease-out-cubica"
        desplazamiento_px: 48
        duracion_elemento_s: 0.5
        fps: 30
        escalones_s:
          logo: 0.0
          subtitulo: 0.25
        _escalones_origen: "el logo primero porque es la marca, y el subtítulo 0.25 s después. El último acaba en 0.75 s de los 5.0 que dura el frame, así que quedan 4.25 s quieto — y el subtítulo hay que poder leerlo desde el principio, no esperar a que termine de moverse."
        ⚠️_alfa: "esta pieza va SOBRE VÍDEO, así que su animación NO puede ser un MP4 normal: se entrega como secuencia PNG con alfa y como ProRes 4444, que es lo que los editores saben leer con transparencia. Un H.264 aplanaría el alfa contra negro y taparía el clip entero."

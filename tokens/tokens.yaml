  historias:
    _nota: "FRAMES DE VIDEO para historias, 1080×1920. No es lo mismo que `redes.historia`, que es una pieza estática que se publica tal cual: aquí unas piezas van SOBRE el video (alfa) y otras son cartelas opacas que se intercalan entre clips. La zona segura es la misma porque es la misma app tapando la misma interfaz, y el doctor comprueba que no hay dos verdades."
    px:
      - 1080
      - 1920
    margen_px: 72
    zona_segura_px:
      arriba: 269
      abajo: 250
      _origen: "14 % de 1920 = 268,8 → 269. Ficha de Meta para Stories de ANUNCIOS; para orgánico ninguna plataforma publica zona segura, así que se usa la de anuncios por ser la única con fuente y la más conservadora. Es el MISMO número que `tokens/video.json` del sistema GEW, unificado el 19-sep-2026: antes P4F declaraba 250 por criterio propio y los dos sistemas tenían dos verdades. Abajo son 250: ficha de Meta para Reels de anuncios (área útil 1080×1420)."
    _zona_origen: "copiada de formatos.redes.historia y comprobada por el doctor: si alguien cambia una y no la otra, falla."
    fps_entrega: 30
    _fps_nota: "Los frames son PNG: el fps lo pone el editor. Está aquí para que la duración declarada de cada pieza signifique algo."
    apertura:

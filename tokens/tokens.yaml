    _regla: "El logo se escala para caber en las DOS medidas y se centra. Un logo apaisado metido a la fuerza por altura se sale por los lados — ya pasó en otra ficha."
    logo_area: 0.055
    _logo_area_origen: "Fracción del área de la celda que debe ocupar la TINTA del logo. Iguala el peso óptico entre marcas de nombre corto y largo: escalando solo por ancho, «JCI» salía a 51 px de alto y «Desarrolla» a 18 en el mismo muro (razón 2.83) y el primero se leía casi al triple. Calibrado el 17-ago-2026 sobre el muro de 12 de la p.20 del prototipo."
  bloque_cita:

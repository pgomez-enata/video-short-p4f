    _canonica: "`numero` grande en acento · separador «/» · TÍTULO en versalitas · subtítulo opcional debajo · filete. Es la ÚNICA forma del sistema y la usan los 9 sitios que abren sección."
    variantes_retiradas:
      _nota: "Las 4 formas que conviven en las 8 páginas de referencia. Están aquí para que la auditoría las reconozca en una pieza y diga de dónde salieron. Lo ya publicado con ellas no se retoca."
      barra-numero-barra: "«/ 08 / ORGANIZADORES» (p.12). Dos separadores para un solo número: el de la izquierda no separa nada."
      numero-barra-titulo-mixto: "«04 / Proyectos — Edición Virtual (2/2)» (pp. 6-8). Mezcla versalitas y caja baja en el mismo titular, y mete la paginación de sección dentro del título en vez de en el folio."
      numero-barra-versalita-pequena: "«01 / RESUMEN DEL EVENTO» (pp. 2-3). Misma estructura que la canónica pero con el título al tamaño del subtítulo: la jerarquía se pierde."
      numero-y-titulo-en-dos-lineas: "«06 /» y «QUÉ SIGUE» debajo (p.10). Rompe la línea base entre número y título y descuadra la retícula de la página."
    _por_que_una: "Cuatro cabeceras distintas en catorce páginas es lo que hace que una revista parezca cuatro revistas. La canónica se eligió porque es la única de las cuatro que mantiene la jerarquía (número > título > subtítulo) y cabe en una sola línea base."

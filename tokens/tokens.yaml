    _cabecera_velo: "las piezas con `cabecera()` —identificacion, dato, cita, sticker— llevan un velo detrás del filete y el lockup. NO es decoración: sin él, el lockup blanco de la cabecera medía 1.00 sobre blanco puro y 1.54 sobre la superficie clara de la marca, en las CUATRO. Nadie lo veía porque el medidor solo miraba texto y un logo no es texto."

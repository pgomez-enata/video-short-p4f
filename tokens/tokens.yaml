  fila_logos:
    _que_es: "Logos de organizadores en una fila, SIN tarjeta detrás. El muro de aliados usa `celda_logo`, que dibuja su tarjeta; en un end card los logos van sueltos sobre el fondo."
    logo_area: 0.11
    _logo_area_origen: "CALIBRADO contra el boceto de Piero del 19-sep-2026, no heredado de `celda_logo`. Aquel usa 0.055 porque reparte 12 logos en un muro; aquí son DOS y son protagonistas. Con 0.11 los anchos salen 147 y 232 px contra los 165 y 208 que marca el boceto —ancho medio 189.5 frente a 186.5, 3 px de desvío— y la tinta de los dos queda en 5016 px: razón 1.000, el mismo peso óptico exacto. Por encima de 0.19 IAvanza topa en `max_ancho` y el área deja de igualarse, así que 0.11 está con holgura del techo."
    max_ancho: 0.8
    max_alto: 0.8
    _regla: "El logo se escala para caber en las DOS medidas de su celda y se centra. Los logos van COMPLETOS: se ajusta el lienzo del SVG, nunca el dibujo."
  endcard:
    _que_es: "La cartela de cierre: el lockup de P4F grande y centrado, y debajo el bloque de quién organiza."
    _origen: "boceto de Piero del 19-sep-2026, medido sobre el PNG a 1080×1920. Los cuatro bloques de tinta caen en y 563..708 (logo), 1148..1207 («Organizan»), 1283..1328 (la fila de logos) y 1437..1497 (el tercero)."
    logo:
      ancho_px: 615
      eje_y_px: 635
    _logo_regla: "Del boceto se respeta el ANCHO y el centro vertical; el alto SALE DEL RATIO REAL del lockup (2.292), que da 268 px. El boceto dibuja un texto de maqueta con otra proporción, y un logo no se deforma para cuadrar con un boceto."
    rotulo:
      rol: "etiqueta"
      tamano_px: 36
      eje_y_px: 981
      color: "verde"
      texto: "ORGANIZAN"
    fila:
      eje_y_px: 1080
      alto_px: 120
      ancho_celda_px: 380
      centros_x_px:
        - 312
        - 790
      tinta_px: 5016
    _fila_origen: "los centros salen del boceto: los dos bloques de tinta de esa fila caen en x 230..394 (centro 312) y 686..893 (centro 790), con 292 px de hueco entre ellos."
    tercero:
      eje_y_px: 1227
      alto_px: 170
      ancho_px: 560
      logo: "logo/organizadores/ayudar-me-da-vida.png"
      tinta_px: 5016
    _tercero_nota: "«Ayudar me da vida»: el logo salió de la página de aliados de la GEW (`Web_Pagina_GEW/.../tour-intercolegial/img/ayudar-naranja.png`), que es donde Piero dijo que estaba. Es PNG con alfa, tinta 978×909, naranja #F87B02, que da 7.52 sobre el fondo del end card. De los 4 candidatos del disco es el único con transparencia: los otros tres son JPG o PNG sin alfa y pegarían un recuadro blanco sobre la pieza."
    web:
      rol: "cuerpo-fuerte"
      tamano_px: 34
      eje_y_px: 1610
      color: "gris-borde"
    _fila_tinta_origen: "la tinta que produce `logo_area` 0.11 en esta celda: 5016 px para Enlata y 5016 para IAvanza, razón 1.000. Se declara como número para poder igualarla en la fila del tercero, que tiene otra caja."
    _tercero_tinta_origen: "el MISMO peso óptico que los dos organizadores. Su logo es casi cuadrado (ratio 1.076) y con el área relativa de su celda topaba en `max_alto` y salía mucho más pequeño que los wordmarks apaisados. Los tres van de iguales en la pieza, así que los tres llevan la misma tinta."
    entrada:
      _que_es: "El movimiento de ENTRADA del end card: cada elemento aparece por su cuenta, no todos de golpe."
      _forma: "fade + subida. Cada elemento arranca 48 px por debajo de su sitio y sube mientras aparece. Nada de escalados ni rebotes: la pieza es el cierre de marca, no un efecto."
      curva: "ease-out-cubica"
      _curva_origen: "1-(1-t)³. Arranca rápido y frena al llegar, que es como se mueve algo que se posa. Lineal se ve mecánico y ease-in-out se ve lento en 0.5 s."
      desplazamiento_px: 48
      duracion_elemento_s: 0.5
      fps: 30
      escalones_s:
        logo: 0.0
        rotulo: 0.2
        enlata: 0.32
        iavanza: 0.44
        tercero: 0.56
        web: 0.92
        marco: 0.68
        gew: 0.8
      _escalones_origen: "de arriba abajo, que es como se lee la pieza. El último arranca en 0.92 y termina en 1.42 s, así que en un end card de 3.0 s quedan 1.58 s quieto: un cierre tiene que dejarse leer, no acabar moviéndose."
      _regla: "El ÚLTIMO fotograma de la animación tiene que ser idéntico al PNG estático. Si no lo es, la animación está inventando una composición que nadie aprobó — y eso se comprueba, no se supone."
    marco:
      _que_es: "El evento DENTRO del que ocurre Pitch 4 Fun. No es un organizador: es el marco, y por eso baja a su propia franja con su propio rótulo en vez de entrar en la fila de arriba."
      _por_que_aparte: "Piero, 19-sep-2026. Meter la GEW en la fila de «ORGANIZAN» la declararía organizadora del evento, que no lo es. «EN EL MARCO DE» dice lo que pasa de verdad y es la misma fórmula que se usó en la invitación a la Dominicana Tech Week."
      rotulo:
        rol: "etiqueta"
        tamano_px: 36
        eje_y_px: 1392
        color: "verde"
        texto: "EN EL MARCO DE"
      _rotulo_color: "verde, el mismo que «ORGANIZAN»: es el mismo rol —un rótulo que presenta logos— y darle otro color al mismo rol es la incoherencia, no la jerarquía. La jerarquía la marcan el orden y el aire de encima (90 px contra 60)."
      eje_y_px: 1510
      alto_px: 120
      ancho_px: 420
      tinta_px: 5016
      logo: "logo/marco/gew-rd-lockup-blanco.png"
      _logo_origen: "`gew-rd-lockup-blanco.png` del sistema GEW (04 Marca/gew_design_system/logo). PNG con alfa, tinta 3438×1174 (razón 2.928), 23.8 % de píxeles pintados. Es la variante blanca porque el end card es oscuro."
      _tinta_origen: "la MISMA tinta óptica que los otros tres logos: 5016 px. Con su razón y su densidad eso da una caja de 248×85. Igualar la tinta y no la altura es lo que hace que cuatro logos de formas distintas pesen lo mismo en la pieza."
    _ritmo_origen: "el aire entre bloques, medido sobre la pieza: 200 px bajo el lockup, 60 entre rótulo y logos dentro de un mismo bloque, 90 al abrir el bloque del marco —más que 60 para que se lea como otra cosa— y 41 px entre la web y el límite de la zona segura. Al entrar la GEW el 19-sep-2026 los tres bloques de organizadores subieron (rótulo 1178→981, fila 1305→1080, tercero 1455→1227) y la web se quedó donde estaba: lo que se comprimió fue el hueco de 397 px que había bajo el lockup, no el margen de abajo."
